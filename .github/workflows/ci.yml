name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    # v1.11.1：补 Windows 矩阵——项目为 Windows-first（.bat 启动器 + Electron win portable），
    # 此前仅在 ubuntu 验证；lint:src / typecheck 随 src/modules 归档移除（见 git tag archive/src-snapshot-v1.9.9）
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage
      - run: npm run build:check
      - run: npm run lint

  # D6: E2E 完整用户流程（Playwright，file:// 直接加载单文件，无需服务器）
  # 仅在 main/master push 时运行（PR 已由上面的单测矩阵覆盖），避免拖慢每次提交
  e2e:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E (full user flow)
        run: npm run e2e
        timeout-minutes: 10
