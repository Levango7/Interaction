name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# v3.7.52：连续 push 时旧 run 自动取消，避免两套全量测试互相抢资源（本地并发跑会触发
# vitest worker RPC 超时，CI 上表现为随机假红）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # v1.11.1：补 Windows 矩阵——项目为 Windows-first（.bat 启动器 + Electron win portable），
    # 此前仅在 ubuntu 验证；lint:src / typecheck 随 src/modules 归档移除（见 git tag archive/src-snapshot-v1.9.9）
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      # 源码态门禁：仓库里提交的应是源码态（HTML 只有占位标记、代码在 src/、立绘在 assets/pet）
      # 必须在任何 pre 钩子（src-split / pet-art）之前跑，否则工作区已被拼成交付态、检查失效
      - run: npm run check:source-state
      # v3.7.62：src↔HTML 一致性门禁。check:source-state 只守「标记在、体积 <1.2MB」——
      # 部分块被拼回内容提交（总量没超上限）能溜过它；--check 逐块比对内容兜住这类半交付态。
      # 同样必须在任何 pre 钩子之前跑（pre* 会把工作区拼成交付态，比对口径随之改变）。
      - run: npm run src:check
      # 模块依赖门禁：对照基线，新增「循环依赖 / 逆层依赖 / 跨块重复定义」即失败
      - run: npm run check:modules
      # AI 工具文档门禁：docs/ai-tools.md 的工具集必须与源码 TOOLS 完全一致（防文档漂移）。
      # v3.7.41：本脚本此前只读 agent-workbench.html，而仓库恒为源码态 → 恒解析到 0 个工具、
      # 静默 abort（且未接 CI）。修复为双态寻源后正式接入。
      - run: npm run check:ai-tools-doc
      - run: npm ci
      - run: npm test
      # v3.7.52：移除 `npm run test:coverage`——单文件 HTML 架构下 v8 无法插桩，
      # 覆盖率恒为 0%（vitest.config.js 已注明），该步骤既无语义又让整套测试白跑第二遍。
      # 拆分模块（docs/architecture-layers.md 步骤②~⑤）之后再加回并配 thresholds。
      - run: npm run build:check
      # v3.7.59：npm run lint 现在含三道 —— eslint + lint-colors（硬编码色）+ lint-xss（未消毒 innerHTML）。
      # lint-xss 是本轮审计新增的构建期门禁：此前「xss_risk」只是应用内 dev-tools 的提示规则，
      # 从未接入构建，于是「id/color 直接拼进属性且调用点不过 sanitizeHtml」这类注入能长期存在。
      # v3.7.60：加第四道 lint-css-structure（样式表括号配平 / 意外嵌套）。触发案例：
      # .cmd-group 漏一个 `}` 使 .cmd-hit 被解析成 CSS 嵌套选择器而永不命中，
      # 命令面板命中高亮静默失效 6 个版本——浏览器对残缺样式表只做错误恢复，不会报任何错。
      - run: npm run lint
      # v3.7.52：补齐三处「写了但没接」的门禁（此前仅本机手动跑）
      - run: npm run lint:layers
      # v3.7.70 接入：此前 scripts/lint-tokens.mjs 零引用（package.json 与所有 workflow 均无）。
      # 本轮给它补了「悬空令牌」检查（var(--x) 引用了但零定义 → 浏览器静默回退，
      # 背景透明/描边丢失/字号回默认，无任何其他手段能发现），并按基线棘轮只拦新增。
      # 裸 px 收敛提示部分仍为非阻断，与本步骤的阻断语义分开。
      - run: npm run lint:tokens
      - run: npm run check:pwa-icons
      - run: npm run pet:check

  # D6: E2E 完整用户流程（Playwright，file:// 直接加载单文件，无需服务器）
  # v3.7.53：改为 **push 与 PR 都运行**。原策略只在 main push 跑，理由是"PR 已由单测矩阵覆盖"——
  # 但渲染层的不变量（对比度硬断言、跨视口布局、表单等宽、按钮居中）单测覆盖不到，
  # 用户标注的窄屏缺陷正是这类：合并后才发现。代价约 3 分钟 CI（单 job，可接受）。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm run check:source-state
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E (full user flow)
        run: npm run e2e
        timeout-minutes: 10
