name: Build Electron portable exe

# 背景（2026-10-05 审计）：
#   本仓的桌面分发形态是「portable exe」，但**本机打不出包** ——
#   electron-builder 要从 github.com 拉 helper 二进制，本机 `github.com:443` 直连不通
#   （实测 TLS 超时，退出码 1）。于是 `electron/dist/` 里最新产物一直是
#   `Agent工坊-3.6.4-portable.exe`（2026-09-17），**与当前 v3.7.89 相差 36 个版本** ——
#   桌面形态实际处于「有构建配置、无可用产物」的状态。
#   根因是网络可达性，不是配置问题，所以正确解法是**把构建搬到 CI**（runner 在 GitHub 上，
#   拉 helper 天然可达），而不是继续在本机折腾。
#
# 触发方式：
#   · workflow_dispatch —— 手动出包（默认分支上点一下即可）
#   · push tag `v*`     —— 发版打 tag 时自动出包，并附到对应 Release
#
# 说明：electron/package.json 的 `prebuild` 会先跑 `../scripts/src-split.mjs` + `pet-art.mjs`
#   把 src/ 拼回单文件并复制到 electron/ —— 这两个脚本**零外部依赖**（只用 node 内置模块），
#   所以本工作流不需要在仓库根跑 `npm ci`。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 出包前先确认仓库处于源码态（与本仓其他工作流同口径）
      - name: 源码态校验
        run: node scripts/check-source-state.mjs

      # electron 子目录的依赖（electron + electron-builder）
      - name: 安装 electron 依赖
        working-directory: electron
        run: npm ci

      # prebuild（拼回单文件 + 复制）→ electron-builder --win --x64 --publish=never
      # electron-builder 的原始产物名：electron/dist/Agent工坊-<version>-portable.exe（含中文，
      #   由 productName="Agent 工坊" 决定）→ 随即被下一步重命名为纯 ASCII 名再上传，见其注释。
      - name: 构建 portable exe
        working-directory: electron
        run: npm run dist
        timeout-minutes: 20

      # 产物重命名为**纯 ASCII** 再上传（v3.7.90 修）：
      #   electron-builder 按 productName="Agent 工坊" 产出 `Agent工坊-3.7.90-portable.exe`（含中文），
      #   而 softprops/action-gh-release 上传时会净化非 ASCII 字符 —— 实测 Release 上的资产名
      #   变成 `Agent.-3.7.90-portable.exe`（「工坊」→ `.`），与构建名、与本文档注释均不一致。
      #   下载方会拿到一个来路不明的文件名，且不同工具/系统的净化规则可能不同。
      #   故此处统一改为纯 ASCII 名，构建名与发布名自此一致。
      - name: 重命名为纯 ASCII（避开 Release 上传时的非 ASCII 净化）
        working-directory: electron
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # v3.7.91 加固：原版 `for f in dist/*-portable.exe` 在**零匹配**时循环零次迭代，
          # 配合 `set -e` 也不报错 → 重命名「静默成功」，一个文件都没改却报绿。
          # （本机复刻实测：目录里只有 setup.exe 时 EXIT=0，无任何告警。）
          # 若将来 electron-builder 因配置变动改了产物名，Release 会重新带出中文名且门禁不红。
          # 故先**强制**要求存在匹配，并用计数兜底。
          files=(dist/*-portable.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::未找到 dist/*-portable.exe —— electron-builder 产物名可能已变动（检查 electron/package.json 的 productName/artifactName），拒绝静默通过"
            echo "--- dist 实际内容 ---"
            ls -la dist/ || true
            exit 1
          fi

          renamed=0
          for f in "${files[@]}"; do
            base=$(basename "$f")
            ver=$(sed -n 's/.*-\([0-9][0-9.]*\)-portable\.exe/\1/p' <<< "$base")
            [ -n "$ver" ] || { echo "::error::无法从 $base 解析版本号"; exit 1; }
            new="AgentWorkbench-${ver}-portable.exe"
            [ "$base" = "$new" ] && { echo "已是 ASCII 名：$base"; renamed=$((renamed+1)); continue; }
            mv "$f" "dist/$new"
            echo "重命名：$base -> $new"
            renamed=$((renamed+1))
          done

          # 兜底断言：至少处理了 1 个产物（防未来逻辑改动引入新的静默路径）
          [ "$renamed" -ge 1 ] || { echo "::error::重命名步骤未处理任何产物"; exit 1; }

          # 终态复核：dist 下**不得**残留非 ASCII 名字的 exe（这才是本步骤的真正目标）
          shopt -u nullglob
          if ls dist/*.exe 2>/dev/null | LC_ALL=C grep -q '[^ -~]'; then
            echo "::error::dist 下仍存在非 ASCII 文件名的 exe："
            ls -la dist/*.exe
            exit 1
          fi
          shopt -s nullglob

          echo "✅ 已处理 $renamed 个产物，且 dist 下无非 ASCII 文件名"
          ls -la dist/*.exe

      - name: 列出产物
        working-directory: electron
        shell: bash
        run: ls -la dist/*.exe

      - name: 上传为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: agent-workbench-portable-exe
          path: electron/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      # 打 tag 触发时，附到对应 Release（若该 Release 尚不存在则创建）
      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/*.exe
          fail_on_unmatched_files: true
