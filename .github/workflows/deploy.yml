name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# v3.7.52：连续 push 时取消上一次未完成的部署（否则两个 run 会并发写 gh-pages 互踩）
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  # v3.7.52：发布前必须过门禁。此前 deploy 是独立工作流、与 ci.yml 无任何依赖关系，
  # push main 直接 build:prod 就发线上 —— **CI 全红也照样上线**。
  # 现在把最小必要门禁内联成前置 job（不跨工作流耦合，同时保持「发出去的产物一定过了测试」）。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm run check:source-state
      - run: npm ci
      - run: npm test
      - run: npm run build:check
      - run: npm run lint
      - run: npm run check:modules

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deploy files
        run: |
          mkdir -p _deploy
          npm ci
          npm run build:prod
          cp agent-workbench.prod.html _deploy/agent-workbench.html
          cp manifest.json _deploy/
          cp icon.svg _deploy/
          cp icon-192.png _deploy/
          cp icon-512.png _deploy/
          # SW 用 prod 产物（CACHE_VERSION 已自动 bump，确保客户端吃到新 HTML 而非旧缓存）
          cp service-worker.prod.js _deploy/service-worker.js
          # sql.js 本地副本（离线可用；缺失时前端会回退 CDN）
          mkdir -p _deploy/assets && cp -r assets/sql _deploy/assets/
          # 创建 index.html 跳转
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=agent-workbench.html"></head></html>' > _deploy/index.html
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
          publish_branch: gh-pages