name: Deploy to GitHub Pages
# P2-部署配置修复：deploy 必须在 CI 通过后才运行，避免未通过测试/lint 的提交被部署到 gh-pages。
# 采用 workflow_run trigger：CI workflow（ci.yml）完成后触发，仅当 CI 结论为 success 才进入 deploy job。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# P2-部署配置修复：并发控制——同一时刻只允许一个部署任务运行，避免 gh-pages 推送竞态。
# cancel-in-progress: false 保证正在进行的部署不被中断（中断可能留下半成品 _deploy 推送）；
# 新触发会排队等待前一个完成（GitHub 默认最多排队 1 个，多余的自动跳过）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run 的 completed 事件无论 CI 成功/失败都会触发，需用 if 限定仅 success 才部署。
    # workflow_dispatch 手动触发时 github.event.workflow_run 不存在，需放行。
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Prepare deploy files
        run: |
          mkdir -p _deploy
          npm ci
          npm run build:prod
          cp agent-workbench.prod.html _deploy/agent-workbench.html
          cp manifest.json _deploy/
          cp icon.svg _deploy/
          cp icon-192.png _deploy/
          cp icon-512.png _deploy/
          # SW 用 prod 产物（CACHE_VERSION 已自动 bump，确保客户端吃到新 HTML 而非旧缓存）
          cp service-worker.prod.js _deploy/service-worker.js
          # 创建 index.html 跳转
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=agent-workbench.html"></head></html>' > _deploy/index.html
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
          publish_branch: gh-pages
