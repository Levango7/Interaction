name: Deploy to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  # v3.7.90：新增——ci-e2e-status job 需读 Actions API（查询同一 commit 的 ci.yml 结论）。
  # 缺此权限时 gh api 返回 403，该 job 会保守回退为「自己跑 e2e」（不会漏门禁，但失去去重收益）。
  actions: read

# v3.7.52：连续 push 时取消上一次未完成的部署（否则两个 run 会并发写 gh-pages 互踩）
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  # v3.7.90 —— 去重守卫：查同一 commit 的 ci.yml 是否已跑过 e2e，是则本 workflow 不再重复跑。
  #   背景（见下方 e2e job 的注释）：ci.yml 与 deploy.yml 的 e2e 都由 push: [main] 触发，
  #   此前每次 push 重复跑两遍，叠加 ci.yml 的双矩阵 test 共 5 个重负载 job 抢 CPU，
  #   导致 e2e 偶发假红（2026-10-05 run 37324421400 红 / 同 commit run 37324421579 绿）。
  #
  #   判据：该 sha 上名为 "CI" 的 run 里，job 名为 "e2e" 的 conclusion == success
  #     → skip=true（Deploy 不重复跑）；否则 skip=false（自己全量跑，兜底）。
  #
  #   ⚠️ 竞态：CI 与本 workflow 由同一次 push 同时触发，查询时 CI 的 e2e 往往仍在 running。
  #     故必须**轮询等待到终态**，不能见到 running 就当「未覆盖」直接跑（那等于没去重），
  #     也不能当「已覆盖」直接跳过（可能最后是红的）。超时（12 分钟）则保守回退为「自己跑」。
  #   ⚠️ 任何失败（403 / 网络 / 解析）一律 skip=false —— fail-open 到「跑」，
  #     宁可重复执行，绝不漏掉 e2e 门禁。
  ci-e2e-status:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.probe.outputs.skip }}
    steps:
      - name: Probe ci.yml e2e conclusion for this commit
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          echo "查 $SHA 的 ci.yml e2e 结论（最长轮询 12 分钟）"
          deadline=$(( $(date +%s) + 720 ))
          skip="false"
          while :; do
            # 列出该 sha 的 run，取 name==CI 的那条（若有多条取最新）
            runs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SHA}&per_page=100" \
                     --jq '[.workflow_runs[] | select(.name=="CI")] | sort_by(.created_at) | last | .id' 2>/dev/null || echo "")
            if [ -z "$runs" ] || [ "$runs" = "null" ]; then
              echo "  未找到该 sha 的 CI run（可能尚未创建）→ 等待"
            else
              # 取该 run 里 job 名以 e2e 开头的 conclusion（矩阵 job 名为 "e2e"）
              conc=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${runs}/jobs?per_page=100" \
                       --jq '[.jobs[] | select(.name|startswith("e2e"))] | .[0].conclusion // "pending"' 2>/dev/null || echo "pending")
              echo "  CI run ${runs} 的 e2e conclusion = ${conc}"
              case "$conc" in
                success)                 skip="true";  break ;;
                failure|cancelled|timed_out|action_required|stale)
                                         skip="false"; break ;;
                *)                       : ;;   # pending / queued / in_progress / null → 继续等
              esac
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "  轮询超时（12 分钟）→ 保守回退：本 workflow 自己跑 e2e"
              skip="false"; break
            fi
            sleep 20
          done
          # 显式写出：任何异常路径也必须产出 skip（默认 false = 自己跑），
          # 否则 outputs 为空串——虽然空串也会让 e2e 的 if 判真（fail-open 正确），
          # 但显式值更可读、也免于将来 if 条件改成 == 判断时踩坑。
          echo "skip=${skip}"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

  # v3.7.52：发布前必须过门禁。此前 deploy 是独立工作流、与 ci.yml 无任何依赖关系，
  # push main 直接 build:prod 就发线上 —— **CI 全红也照样上线**。
  # 现在把最小必要门禁内联成前置 job（不跨工作流耦合，同时保持「发出去的产物一定过了测试」）。
  #
  # v3.7.59：补齐与 ci.yml 的差距。此前 verify 只跑 5 项，比 ci.yml 少
  # check:ai-tools-doc / lint:layers / check:pwa-icons / pet:check，且**完全不跑 e2e** ——
  # 即「CI 全绿才上线」这句只做到了一半：渲染层不变量（对比度、跨视口布局、表单等宽）
  # 恰恰是单测覆盖不到、而 ci.yml 专门加了 e2e 来守的那一类。
  # 现按 ci.yml 的步骤与顺序对齐；e2e 另起一个并行 job，不增加发布总时长。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      # 与 ci.yml 同序：源码态/模块图/AI 工具文档三项不依赖 node_modules，先跑
      - run: npm run check:source-state
      # v3.7.70 补：发布链此前缺这一步（ci.yml:35 有，本文件无）。
      # check:source-state 只守「标记在、体积 <1.2MB」——部分块被拼回内容提交而总量没超上限时
      # 能溜过它；src:check 逐块比对内容兜住这类「半交付态」。
      # 缺口后果：src↔HTML 不一致的代码在合并进 main 后会被 ci.yml 拦下，
      # 但 deploy 链无人把守 → 仍可能上线。必须在 pre 钩子之前跑。
      - run: npm run src:check
      - run: npm run check:modules
      - run: npm run check:ai-tools-doc
      - run: npm ci
      - run: npm test
      - run: npm run build:check
      - run: npm run lint
      - run: npm run lint:layers
      - run: npm run lint:tokens
      - run: npm run check:pwa-icons
      - run: npm run pet:check

  # v3.7.59：与 ci.yml 的 e2e job 对齐（同一套用例、同一 file:// 加载方式）。
  # v3.7.90 前：与 verify 并行 → 发布总时长不增加。
  # v3.7.90 起：改为需先等 ci-e2e-status 探测出结论，故不再纯并行。
  #   实测（run 37338395078）：探测 16:07:49→16:14:32（6m43s，含 15 次 pending 轮询），
  #   而 verify 16:07:50→16:17:07（9m17s）—— **探测被 verify 覆盖，不在关键路径上**，
  #   故该次 Deploy 总时长 10m49s，与旧方案历史区间（6m28s ~ 10m21s）相当。
  #   ⚠️ 但这不是必然：若 CI run 排队过久（其 e2e 迟迟不出 conclusion），探测可能反超 verify
  #   而成为瓶颈，此时总时长会增加。极端情形为下面 ci-e2e-status 注明的 12 分钟超时。
  #
  # v3.7.90 —— 与 ci.yml 去重（消除并发抢 CPU 导致的假红）：
  #   现象：2026-10-05 run 37324421400（commit d2d11d4）e2e job 红，而**同一 commit** 的
  #     ci.yml run 37324421579 e2e job 全绿 82 passed。代码同一、用例同一、runner 镜像逐字一致
  #     （ubuntu-24.04 / image 20260927.320.1 / node 20.20.2）→ 一处红一处绿，只能是环境抖动。
  #   根因：两 workflow 都由 push: [main] 触发，各跑一遍同一套 e2e；叠加 ci.yml 的
  #     windows/ubuntu 双矩阵 test，同一时刻 5 个重负载 job 抢 CPU。playwright.config.js
  #     恒 workers:1，单 chromium 对 CPU 饥饿极敏感：该次 i18n.spec.js:95 首跑 16.7s，
  #     CI 同用例仅 2.6s（慢 6.4 倍），重试即回到 2.7s —— 典型饥饿指纹。
  #   处置：**不删此 job**（verify job 内联了全套门禁，e2e 是它唯一缺口，删了就丢「上线必过 e2e」），
  #     而是先由 ci-e2e-status 探测「该 commit 的 ci.yml e2e 是否已 success」：
  #       · 已 success → 本 job 跳过（skip=true），不再重复执行、不再抢 CPU
  #       · 否则（红/取消/查不到/超时）→ 本 job 全量跑，兜住门禁
  #     探测失败一律视为「未覆盖」→ 跑。宁可重复执行，绝不放行未验证的产物。
  e2e:
    needs: [ci-e2e-status]
    # v3.7.92 修复（真实触发的门禁缺口，见文件末注释）：
    #   原实现 `if: needs.ci-e2e-status.outputs.skip != 'true'` + 无 always()，隐含假设
    #   "ci-e2e-status 这个 job 总会跑完（probe 自捕获异常，结论不会是 failure）"。
    #   **该假设漏掉了「job 本身根本没启动」**：GitHub 托管 runner 分配失败时
    #   ci-e2e-status 的 conclusion = cancelled 且 steps=[]（2026-10-05 实测，连续 4 次）。
    #   此时 GitHub 默认语义「needs 上游 cancelled → 下游 skipped」会让本 job **被动跳过**，
    #   而 deploy 的条件又把任何 skipped 当作"已由 CI 覆盖" → **e2e 门禁被静默绕过**。
    #   修法：① 加 always()，让本 job 不再被上游取消连带跳过、必须自行判定条件；
    #        ② 条件收紧为「仅当上游 **确实成功** 且探测到 skip=true 时才跳过」，
    #           其余一切情形（取消/失败/输出缺失）一律**跑**——fail-closed。
    if: always() && !(needs.ci-e2e-status.result == 'success' && needs.ci-e2e-status.outputs.skip == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm run check:source-state
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E (full user flow)
        run: npm run e2e
        timeout-minutes: 10

  deploy:
    needs: [verify, e2e, ci-e2e-status]
    # ⚠️ 必须显式放行 skipped —— e2e 在「CI 已跑过且成功」时会被上面的 if 跳过，
    #   而 GitHub 官方语义（docs.github.com「Defining prerequisite jobs」）：
    #   needs 的上游 job「fails or is skipped」时，依赖它的 job **默认被跳过**，
    #   除非用条件表达式显式放行。少了这一行，push 时部署会静默不执行。
    # 条件设计（fail-closed，v3.7.92 收紧）：
    #   · verify 必须 success（红/取消 → 不部署）
    #   · e2e 必须 success，**或**「skipped 且其 skipped 事出有因」——
    #     即上游 ci-e2e-status 确实 success 且 skip='true'（= 该 commit 的 CI e2e 已绿）。
    #     v3.7.92 前只判 `needs.e2e.result == 'skipped'`，无法区分：
    #       (a) 主动跳过（CI 已覆盖，安全）
    #       (b) **被动跳过**（ci-e2e-status 因 runner 分配失败被取消，e2e 未跑 → 不安全）
    #     两者在 `needs.e2e.result` 上都是 'skipped'，故必须补查上游 ci-e2e-status 的结论。
    #   不能用 always() 了事 —— 那会连 verify 失败也放行，等于撤掉门禁。
    if: >-
      always()
      && needs.verify.result == 'success'
      && (
           needs.e2e.result == 'success'
           || (needs.e2e.result == 'skipped'
               && needs.ci-e2e-status.result == 'success'
               && needs.ci-e2e-status.outputs.skip == 'true')
         )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare deploy files
        run: |
          mkdir -p _deploy
          npm ci
          npm run build:prod
          cp agent-workbench.prod.html _deploy/agent-workbench.html
          cp manifest.json _deploy/
          cp icon.svg _deploy/
          cp icon-192.png _deploy/
          cp icon-512.png _deploy/
          # SW 用 prod 产物（CACHE_VERSION 已自动 bump，确保客户端吃到新 HTML 而非旧缓存）
          cp service-worker.prod.js _deploy/service-worker.js
          # sql.js 本地副本（离线可用；缺失时前端会回退 CDN）
          mkdir -p _deploy/assets && cp -r assets/sql _deploy/assets/
          # 创建 index.html 跳转
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=agent-workbench.html"></head></html>' > _deploy/index.html
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
          publish_branch: gh-pages